# agentsh server configuration for Modal Sandboxes
# agentsh v0.16.9

server:
  http:
    addr: "127.0.0.1:18080"
    read_timeout: "30s"
    write_timeout: "60s"
    max_request_size: "10MB"
  grpc:
    enabled: true
    addr: "127.0.0.1:9090"

auth:
  type: "none"

logging:
  level: "debug"
  format: "text"
  output: "stderr"

sessions:
  base_dir: "/var/lib/agentsh/sessions"
  max_sessions: 100
  default_timeout: "1h"
  default_idle_timeout: "15m"
  cleanup_interval: "5m"
  real_paths: true  # v0.13.0: use real host paths

audit:
  enabled: true
  storage:
    sqlite_path: "/var/lib/agentsh/events.db"

sandbox:
  enabled: true
  allow_degraded: true  # Start even if FUSE/seccomp fail

  limits:
    max_memory_mb: 4096
    max_cpu_percent: 100
    max_processes: 256

  # v0.16.9: ptrace-based enforcement (works on gVisor/Modal)
  ptrace:
    enabled: true
    attach_mode: "children"
    mask_tracer_pid: "off"
    trace:
      execve: true
      file: true
      network: true
      signal: true
    performance:
      seccomp_prefilter: false   # gVisor doesn't support seccomp BPF injection
      max_tracees: 500
      max_hold_ms: 5000
    on_attach_failure: "fail_open"

  fuse:
    enabled: true
    deferred: true
    deferred_marker_file: "/tmp/.agentsh-fuse-enabled"
    deferred_enable_command: ["/bin/chmod", "666", "/dev/fuse"]

  network:
    enabled: true
    intercept_mode: "all"
    proxy_listen_addr: "127.0.0.1:0"

  cgroups:
    enabled: false

  unix_sockets:
    enabled: false  # mutually exclusive with ptrace

  env_inject:
    BASH_ENV: "/usr/lib/agentsh/bash_startup.sh"

proxy:
  mode: "embedded"
  port: 0
  providers:
    anthropic: "https://api.anthropic.com"
    openai: "https://api.openai.com"
  mcp:
    enforce_policy: true
    intercept_tool_calls: true
    rate_limit:
      rpm: 60
      tpm: 100000

# v0.11.0: MCP security
mcp:
  servers: []
  cross_server:
    enabled: true
    detect_shadow_tools: true
    detect_burst: true
    burst_threshold: 10
    burst_window: "5s"
    detect_read_then_send: true
    detect_cross_server_flow: true
  version_pinning:
    enabled: true
    on_change: "block"
  tool_rate_limit:
    enabled: true
    max_calls_per_minute: 30
  tool_output_inspection:
    enabled: true
    detect_prompt_injection: true
    detect_credential_theft: true
    detect_exfiltration: true
  argument_scanning:
    enabled: true
    detect_shell_injection: true
    detect_credential_paths: true
    detect_exfiltration_urls: true
  sampling:
    default_action: "block"
  allowed_transports: ["stdio"]
  binary_pinning:
    enabled: true
    on_mismatch: "block"

# v0.12.0: Threat intelligence feeds
threat_feeds:
  enabled: true
  action: "deny"
  feeds:
    - name: "urlhaus"
      url: "https://urlhaus.abuse.ch/downloads/hostfile/"
      format: "hostfile"
      refresh_interval: "6h"
    - name: "phishing"
      url: "https://raw.githubusercontent.com/mitchellkrogza/Phishing.Database/master/phishing-domains-ACTIVE.txt"
      format: "domain-list"
      refresh_interval: "12h"
  allowlist:
    - "github.com"
    - "*.github.com"
    - "pypi.org"
    - "registry.npmjs.org"
    - "api.anthropic.com"
    - "api.openai.com"

# v0.12.0: Package install security scanning
package_scanning:
  enabled: true
  providers: ["osv", "local"]
  on_failure: "deny"
  cache_ttl: "1h"
  rules:
    - name: "block-critical-vulns"
      severity: ["critical"]
      action: "deny"
    - name: "alert-high-vulns"
      severity: ["high"]
      action: "alert"
    - name: "allow-rest"
      action: "allow"

dlp:
  mode: "redact"
  patterns:
    email: true
    phone: true
    credit_card: true
    ssn: true
    api_keys: true
  custom_patterns:
    - name: modal_key
      display: MODAL_KEY
      regex: "ak-[a-zA-Z0-9]{32,}"
    - name: openai_key
      display: OPENAI_KEY
      regex: "sk-[a-zA-Z0-9]{48,}"
    - name: anthropic_key
      display: ANTHROPIC_KEY
      regex: "sk-ant-[a-zA-Z0-9-]{95,}"
    - name: aws_access_key
      display: AWS_KEY
      regex: "AKIA[0-9A-Z]{16}"
    - name: github_pat
      display: GITHUB_TOKEN
      regex: "ghp_[a-zA-Z0-9]{36}"
    - name: github_oauth
      display: GITHUB_OAUTH
      regex: "gho_[a-zA-Z0-9]{36}"
    - name: jwt_token
      display: JWT
      regex: "eyJ[a-zA-Z0-9_-]*\\.eyJ[a-zA-Z0-9_-]*\\.[a-zA-Z0-9_-]*"
    - name: private_key
      display: PRIVATE_KEY
      regex: "-----BEGIN [A-Z]+ PRIVATE KEY-----"
    - name: slack_token
      display: SLACK_TOKEN
      regex: "xox[baprs]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9]{24}"

policies:
  dir: "/etc/agentsh/policies"
  default_policy: "default"

approvals:
  enabled: false
  mode: "async"
  timeout: "5m"

metrics:
  enabled: true
  path: "/metrics"

health:
  path: "/health"
  readiness_path: "/ready"

development:
  disable_auth: true
  verbose_errors: true
